name: short

# Ручний запуск: збирає пробний вертикальний ролик (YouTube Shorts) і кладе його в data/shorts/.
# Нічого не публікується ні в канал, ні на YouTube.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Який ролик"
        type: choice
        default: games
        options: [games, anime, series, top3]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -r requirements.txt edge-tts pillow numpy playwright
          playwright install --with-deps chromium

      - name: Build short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TEXT_PROVIDER: ${{ vars.TEXT_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p data/shorts
          if [ "${{ inputs.kind }}" = "top3" ]; then
            python scripts/make_short.py data/shorts/top3_items.json data/shorts/top3.mp4 2>&1 | tee "data/shorts/${{ inputs.kind }}.log"
          else
            python scripts/make_channel_short.py "data/shorts/${{ inputs.kind }}.mp4" --topic "${{ inputs.kind }}" 2>&1 | tee "data/shorts/${{ inputs.kind }}.log"
          fi

      - name: Save result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shorts
          git commit -m "chore: short preview [skip ci]" || exit 0
          git checkout -- .   # скидаємо побічні зміни (кеш бази після перегляду), щоб pull --rebase не відмовився
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((RANDOM % 8 + 3)); done
