name: layout-lab

# Лабораторія макетів Shorts: на справжніх обкладинках із журналу постів малює кадр у кількох варіантах
# і надсилає картинками власнику в приват. Нічого не публікує й нічого не позначає показаним.
on:
  workflow_dispatch:
    inputs:
      per_topic:
        description: "Скільки постів із кожної теми"
        default: "2"

permissions:
  contents: read

concurrency:
  group: layout-lab
  cancel-in-progress: true

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements.txt pillow numpy playwright
          playwright install --with-deps chromium
      - name: Render layout variants
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PREVIEW_CHAT_ID: ${{ secrets.PREVIEW_CHAT_ID }}
        run: python scripts/layout_lab.py --per-topic "${{ inputs.per_topic }}" --out out/lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lab
          path: out/lab/*.jpg
          retention-days: 3
          if-no-files-found: ignore
